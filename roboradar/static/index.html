<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboRadar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="logo">📡</span><div><b>RoboRadar</b></div></div>
  <nav id="nav">
    <a data-view="digest" class="active">📄 <span>论文日报</span></a>
    <a data-view="feed">📺 <span>圈内动态</span><em id="feed-badge" class="badge hidden"></em></a>
    <a data-view="starred">⭐ <span>我的收藏</span></a>
    <a data-view="entities">👥 <span>关注列表</span></a>
    <a data-view="topics">🏷️ <span>关键词主题</span></a>
    <a data-view="settings">⚙️ <span>定时与设置</span></a>
    <a data-view="runs">🧾 <span>运行记录</span></a>
  </nav>
  <div class="schedule" id="schedule"></div>
</aside>

<main>
  <div id="jobbar" class="jobbar hidden"></div>
  <section id="view"></section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
